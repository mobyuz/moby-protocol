name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.6.2
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rust tests with generation enabled
        run: cargo test --locked --all-targets --all-features
      - name: Rust tests as a consumer
        run: cargo test --locked --no-default-features
      - name: Generated artifacts are current
        run: npm run generate:check
      - name: TypeScript and JSON Schema contract tests
        run: npm test
      - name: C host USB wire vectors
        if: runner.os == 'Linux'
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -I include tests/usb_vectors.c -o "$RUNNER_TEMP/moby-usb-vectors"
          "$RUNNER_TEMP/moby-usb-vectors" tests/fixtures/usb-vectors.tsv
      - name: Build release package without publishing
        run: npm pack --dry-run
